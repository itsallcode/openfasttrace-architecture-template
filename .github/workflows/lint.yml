name: Lint

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  markdownlint:
    name: markdownlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          show-progress: false
      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: |
            **/*.md
            #node_modules

  changelog:
    name: CHANGELOG.md (heylogs)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          show-progress: false
      - name: Check CHANGELOG.md
        uses: jbangdev/jbang-action@v0.142.0
        with:
          script: com.github.nbbrd.heylogs:heylogs-cli:0.19.1:bin
          scriptargs: check --format github-actions CHANGELOG.md

  textlint:
    name: textlint
    runs-on: ubuntu-latest
    # Spelling hints only, do not block the build
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          show-progress: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run textlint
        run: npm run textlint

  vale:
    name: Vale
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          show-progress: false
      - name: Run Vale
        uses: vale-cli/vale-action@v3
        # Style hints only, do not block the build
        continue-on-error: true
        with:
          fail_on_error: false
