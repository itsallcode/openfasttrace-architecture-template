name: Lint

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  markdownlint:
    name: markdownlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          show-progress: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run markdownlint
        run: npm run markdownlint

  changelog:
    name: CHANGELOG.md (heylogs)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          show-progress: false
      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - name: Cache JBang
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.jbang
          key: jbang-heylogs-${{ hashFiles('.github/workflows/lint.yml') }}
          restore-keys: |
            jbang-heylogs-
      - name: Install JBang
        # The jbangdev/jbang-action is not allowed by the organization's Actions policy, so install JBang directly
        run: curl -Ls https://sh.jbang.dev | bash -s - app setup
      - name: Check CHANGELOG.md
        run: ~/.jbang/bin/jbang com.github.nbbrd.heylogs:heylogs-cli:0.19.1:bin check --format github-actions CHANGELOG.md

  textlint:
    name: textlint
    runs-on: ubuntu-latest
    # Spelling hints only, do not block the build
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          show-progress: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run textlint
        run: npm run textlint

  vale:
    name: Vale
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          show-progress: false
      - name: Run Vale
        uses: vale-cli/vale-action@518a9136acc6e6668ce7c00d367051e0941e87ff # v3.0.0
        # Style hints only, do not block the build
        continue-on-error: true
        with:
          fail_on_error: false
