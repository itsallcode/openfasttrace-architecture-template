name: Check links

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Once a month, to notice external links that died
    - cron: "0 9 1 * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linkspector:
    name: linkspector
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          show-progress: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Run linkspector
        # Runs the CLI directly instead of umbrelladocs/action-linkspector, because the organization's Actions policy
        # only allows actions from GitHub and verified creators
        run: npx --yes @umbrelladocs/linkspector@0.5.6 check -c .linkspector.yml
